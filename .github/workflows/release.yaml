name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - "feature/AS-5467-test-publishing"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'adopt'

      - name: Get project version
        uses: HardNorth/github-version-generate@v1.4.0
        with:
          version-source: file
          version-file: gradle.properties
          version-file-extraction-pattern: '(?<=version=).+'

      - name: Build with Gradle
        env:
          DSE_REPO_USERNAME: ${{ secrets.DSE_REPO_USERNAME }}
          DSE_REPO_PASSWORD: ${{ secrets.DSE_REPO_PASSWORD }}
        run: ./gradlew assemble -Pdse4 -PdseRepoUsername=$DSE_REPO_USERNAME -PdseRepoPassword=$DSE_REPO_PASSWORD

      # Hands the three jars publish-images needs to that job, so it doesn't need its own
      # DSE_REPO_USERNAME/PASSWORD (and doesn't redo this build) just to get at agent-dse4's jar.
      - name: Upload jars for image publishing
        uses: actions/upload-artifact@v4
        with:
          name: agent-jars
          path: |
            agent-c4/build/libs/agent-c4-${{ env.CURRENT_VERSION }}-all.jar
            agent-dse4/build/libs/agent-dse4-${{ env.CURRENT_VERSION }}-all.jar
            backfill-cli/build/libs/backfill-cli-${{ env.CURRENT_VERSION }}-all.jar
          retention-days: 1

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')  # TEMPORARY guard, see branches: note above
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: true

      - name: Upload Connectors Release Tar
        if: startsWith(github.ref, 'refs/tags/')  # TEMPORARY guard, see branches: note above
        id: upload-connectors-release-tar
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }} # This pulls from the CREATE RELEASE step above, referencing it's ID to get its outputs object, which include a `upload_url`. See this blog post for more info: https://jasonet.co/posts/new-features-of-github-actions/#passing-data-to-future-steps
          asset_path: connector-distribution/build/distributions/cassandra-source-connectors-${{ env.CURRENT_VERSION }}.tar
          asset_name: cassandra-source-connectors-${{ env.CURRENT_VERSION }}.tar
          asset_content_type: application/tar
      - name: Upload Connectors Release Zip
        if: startsWith(github.ref, 'refs/tags/')  # TEMPORARY guard, see branches: note above
        id: upload-connectors-release-zip
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }} # This pulls from the CREATE RELEASE step above, referencing it's ID to get its outputs object, which include a `upload_url`. See this blog post for more info: https://jasonet.co/posts/new-features-of-github-actions/#passing-data-to-future-steps
          asset_path: connector-distribution/build/distributions/cassandra-source-connectors-${{ env.CURRENT_VERSION }}.zip
          asset_name: cassandra-source-connectors-${{ env.CURRENT_VERSION }}.zip
          asset_content_type: application/zip

      - name: Upload Agents Release Tar
        if: startsWith(github.ref, 'refs/tags/')  # TEMPORARY guard, see branches: note above
        id: upload-agents-release-tar
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }} # This pulls from the CREATE RELEASE step above, referencing it's ID to get its outputs object, which include a `upload_url`. See this blog post for more info: https://jasonet.co/posts/new-features-of-github-actions/#passing-data-to-future-steps
          asset_path: agent-distribution/build/distributions/cassandra-source-agents-${{ env.CURRENT_VERSION }}.tar
          asset_name: cassandra-source-agents-${{ env.CURRENT_VERSION }}.tar
          asset_content_type: application/tar
      - name: Upload Agents Release Zip
        if: startsWith(github.ref, 'refs/tags/')  # TEMPORARY guard, see branches: note above
        id: upload-agents-release-zip
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }} # This pulls from the CREATE RELEASE step above, referencing it's ID to get its outputs object, which include a `upload_url`. See this blog post for more info: https://jasonet.co/posts/new-features-of-github-actions/#passing-data-to-future-steps
          asset_path: agent-distribution/build/distributions/cassandra-source-agents-${{ env.CURRENT_VERSION }}.zip
          asset_name: cassandra-source-agents-${{ env.CURRENT_VERSION }}.zip
          asset_content_type: application/zip

      - name: Upload Release Pulsar NAR
        if: startsWith(github.ref, 'refs/tags/')  # TEMPORARY guard, see branches: note above
        id: upload-release-pulsar-nar
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }} # This pulls from the CREATE RELEASE step above, referencing it's ID to get its outputs object, which include a `upload_url`. See this blog post for more info: https://jasonet.co/posts/new-features-of-github-actions/#passing-data-to-future-steps
          asset_path: connector/build/libs/pulsar-cassandra-source-${{ env.CURRENT_VERSION }}.nar
          asset_name: pulsar-cassandra-source-${{ env.CURRENT_VERSION }}.nar
          asset_content_type: application/java-archive

      - name: Upload Release agent-c3
        if: startsWith(github.ref, 'refs/tags/')  # TEMPORARY guard, see branches: note above
        id: agent-c3-jar
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }} # This pulls from the CREATE RELEASE step above, referencing it's ID to get its outputs object, which include a `upload_url`. See this blog post for more info: https://jasonet.co/posts/new-features-of-github-actions/#passing-data-to-future-steps
          asset_path: agent-c3/build/libs/agent-c3-${{ env.CURRENT_VERSION }}-all.jar
          asset_name: agent-c3-${{ env.CURRENT_VERSION }}-all.jar
          asset_content_type: application/java-archive
      - name: Upload Release agent-c4
        if: startsWith(github.ref, 'refs/tags/')  # TEMPORARY guard, see branches: note above
        id: agent-c4-jar
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }} # This pulls from the CREATE RELEASE step above, referencing it's ID to get its outputs object, which include a `upload_url`. See this blog post for more info: https://jasonet.co/posts/new-features-of-github-actions/#passing-data-to-future-steps
          asset_path: agent-c4/build/libs/agent-c4-${{ env.CURRENT_VERSION }}-all.jar
          asset_name: agent-c4-${{ env.CURRENT_VERSION }}-all.jar
          asset_content_type: application/java-archive
      - name: Upload Release agent-dse4
        if: startsWith(github.ref, 'refs/tags/')  # TEMPORARY guard, see branches: note above
        id: agent-dse4-jar
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }} # This pulls from the CREATE RELEASE step above, referencing it's ID to get its outputs object, which include a `upload_url`. See this blog post for more info: https://jasonet.co/posts/new-features-of-github-actions/#passing-data-to-future-steps
          asset_path: agent-dse4/build/libs/agent-dse4-${{ env.CURRENT_VERSION }}-all.jar
          asset_name: agent-dse4-${{ env.CURRENT_VERSION }}-all.jar
          asset_content_type: application/java-archive
      - name: Upload Backfill CLI Release JAR
        if: startsWith(github.ref, 'refs/tags/')  # TEMPORARY guard, see branches: note above
        id: upload-backfill-cli-jar
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: backfill-cli/build/libs/backfill-cli-${{ env.CURRENT_VERSION }}-all.jar
          asset_name: backfill-cli-${{ env.CURRENT_VERSION }}-all.jar
          asset_content_type: application/java-archive
      - name: Upload Backfill CLI Release NAR
        if: startsWith(github.ref, 'refs/tags/')  # TEMPORARY guard, see branches: note above
        id: upload-backfill-cli-nar
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: backfill-cli/build/libs/pulsar-cassandra-admin-${{ env.CURRENT_VERSION }}-nar.nar
          asset_name: pulsar-cassandra-admin-${{ env.CURRENT_VERSION }}-nar.nar
          asset_content_type: application/java-archive
  publish-images:
    needs: build
    runs-on: ubuntu-latest
    env:
      REGISTRY: 765730767431.dkr.ecr.us-east-2.amazonaws.com
    steps:
      - uses: actions/checkout@v6

      - name: Get project version
        uses: HardNorth/github-version-generate@v1.4.0
        with:
          version-source: file
          version-file: gradle.properties
          version-file-extraction-pattern: '(?<=version=).+'

      - name: Download jars from build
        uses: actions/download-artifact@v4
        with:
          name: agent-jars
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.ECR_REGION || 'us-east-2' }}
      - name: Log in to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registries: "765730767431"

      - name: Build and push agent-c4 (OSS Cassandra) image
        run: |
          mkdir -p /tmp/ctx-c4
          cp agent-c4/build/libs/agent-c4-${{ env.CURRENT_VERSION }}-all.jar agent-c4/src/docker-k8s/Dockerfile /tmp/ctx-c4/
          docker build \
            --build-arg MGMT_API_VERSION=4.1.12 \
            --build-arg BUILD_VERSION=${{ env.CURRENT_VERSION }} \
            -t "$REGISTRY/datastax/cdc:${{ env.CURRENT_VERSION }}" \
            -t "$REGISTRY/datastax/cdc:latest" \
            /tmp/ctx-c4
          docker push "$REGISTRY/datastax/cdc:${{ env.CURRENT_VERSION }}"
          docker push "$REGISTRY/datastax/cdc:latest"

      - name: Build and push agent-dse4 (DSE) image
        run: |
          mkdir -p /tmp/ctx-dse4
          cp agent-dse4/build/libs/agent-dse4-${{ env.CURRENT_VERSION }}-all.jar agent-dse4/src/docker-k8s/Dockerfile /tmp/ctx-dse4/
          docker build \
            --build-arg MGMT_API_VERSION=6.8.61 \
            --build-arg BUILD_VERSION=${{ env.CURRENT_VERSION }} \
            -t "$REGISTRY/datastax/cdc:${{ env.CURRENT_VERSION }}-dse" \
            -t "$REGISTRY/datastax/cdc:latest-dse" \
            /tmp/ctx-dse4
          docker push "$REGISTRY/datastax/cdc:${{ env.CURRENT_VERSION }}-dse"
          docker push "$REGISTRY/datastax/cdc:latest-dse"

      - name: Build and push backfill-cli admin image
        run: |
          mkdir -p /tmp/ctx-admin
          cp backfill-cli/build/libs/backfill-cli-${{ env.CURRENT_VERSION }}-all.jar backfill-cli/src/docker/Dockerfile /tmp/ctx-admin/
          docker build \
            --build-arg JRE_IMAGE_TAG=17-jre-jammy \
            --build-arg BUILD_VERSION=${{ env.CURRENT_VERSION }} \
            -t "$REGISTRY/datastax/cdc:${{ env.CURRENT_VERSION }}-admin" \
            -t "$REGISTRY/datastax/cdc:latest-admin" \
            /tmp/ctx-admin
          docker push "$REGISTRY/datastax/cdc:${{ env.CURRENT_VERSION }}-admin"
          docker push "$REGISTRY/datastax/cdc:latest-admin"

