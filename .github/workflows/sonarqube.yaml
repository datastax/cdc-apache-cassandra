name: SonarQube Scan

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - master
  workflow_dispatch:
    inputs:
      scan_type:
        description: 'Type of scan to run'
        required: true
        type: choice
        options:
          - branch
          - pr
        default: branch
      ref:
        description: 'Commit SHA, branch, or tag to check out and scan (leave blank to use the default branch)'
        required: false
        type: string
        default: ''

concurrency:
  group: sonarqube-${{ github.ref }}
  cancel-in-progress: true

env:
  TRUSTSTORE_PATH: ./ibm_castorevpcprod

jobs:
  sonarqube-scan:
    name: SonarQube Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history required for accurate blame and new-code period detection.
          fetch-depth: 0
          # When triggered manually with a specific ref (commit SHA, branch, tag),
          # check out that ref; otherwise fall back to the default event ref.
          ref: ${{ (github.event_name == 'workflow_dispatch' && inputs.ref != '') && inputs.ref || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '17'
          cache: gradle

      # Decode the IBM truststore from the base64 secret and write it to disk.
      # Secret is bound to an env var to avoid shell-injection (S7636).
      - name: Decode IBM SonarQube truststore
        env:
          TRUSTSTORE_B64: ${{ secrets.IBM_SONARQUBE_CERT_TRUSTSTORE_BASE64 }}
        run: |
          echo "$TRUSTSTORE_B64" | base64 --decode > "${{ env.TRUSTSTORE_PATH }}"

      # Produce .class files required by SonarQube's Java bytecode analyser.
      - name: Build
        run: ./gradlew build -x test

      # Unit tests only (no containers), so SonarQube gets coverage for new code.
      # Each test task is finalized by jacocoTestReport, which writes
      # <module>/build/reports/jacoco/test/jacocoTestReport.xml.
      # -PbrokerType=all keeps the connector's Kafka unit tests, which are filtered out by default.
      - name: Unit tests with coverage
        run: |
          ./gradlew -PbrokerType=all -x :connector:nar \
            :agent:test \
            :connector:test \
              --tests 'com.datastax.oss.cdc.CassandraSourceConnectorConfig*' \
              --tests 'com.datastax.oss.cdc.MutationCacheTests' \
            --tests 'com.datastax.oss.cdc.SourceUtilTest' \
            --tests 'com.datastax.oss.cdc.CassandraClientSelectRowTest' \
              --tests 'com.datastax.oss.cdc.converters.*' \
              --tests 'com.datastax.oss.kafka.source.converters.*' \
              --tests 'com.datastax.oss.pulsar.source.CassandraSourceRetryTest' \
              --tests 'com.datastax.oss.pulsar.source.CassandraSourceBatchReadTest' \
              --tests 'com.datastax.oss.kafka.source.KafkaCassandraSourceTaskKafkaTest' \
              --tests 'com.datastax.oss.kafka.source.KafkaCassandraSourceTaskRetryTest' \
              --tests 'com.datastax.oss.kafka.source.KafkaCassandraSourceConnectorKafkaTest' \
              --tests 'com.datastax.oss.kafka.source.KafkaSourcePropertiesKafkaTest' \
              --tests 'com.datastax.oss.kafka.source.KafkaCassandraSourceTaskLifecycleKafkaTest' \
            :backfill-cli:test \
              --tests '*ImporterTest' \
              --tests '*MigratorTest'

      # Pinned to v8.2.1 (SHA: 22918119ff8e1ca75a623e15c8296b6ea4fbe28f).
      - name: Run SonarQube scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f
        env:
          SONAR_TOKEN: ${{ secrets.IBM_SONARQUBE_API_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -D sonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -D sonar.projectName=${{ vars.SONAR_PROJECT_NAME }}
            -D sonar.java.source=8
            -D sonar.sources=.
            -D sonar.exclusions=**/proto/**,**/shade/**,**/shaded/**,**/build/**,**/src/test/**
            -D sonar.tests=.
            -D sonar.test.inclusions=**/src/test/**
            -D sonar.coverage.exclusions=testcontainers/**,docs/**
            -D sonar.coverage.jacoco.xmlReportPaths=agent/build/reports/jacoco/test/jacocoTestReport.xml,connector/build/reports/jacoco/test/jacocoTestReport.xml,backfill-cli/build/reports/jacoco/test/jacocoTestReport.xml
            -D sonar.java.binaries=**/build/classes
            -D sonar.scanner.truststorePath=${{ env.TRUSTSTORE_PATH }}
            -D sonar.scanner.truststorePassword=${{ secrets.IBM_SONARQUBE_CERT_PASSWORD }}
            ${{ (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.scan_type == 'pr'))
                && format('-Dsonar.pullrequest.key={0} -Dsonar.pullrequest.branch={1} -Dsonar.pullrequest.base={2}',
                          github.event.pull_request.number, github.head_ref, github.base_ref)
                || format('-Dsonar.branch.name={0}',
                          (github.event_name == 'workflow_dispatch' && inputs.ref != '') && inputs.ref || github.ref_name) }}
